<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CrimsonSync</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <h1>CrimsonSync</h1>
                <p>Next-Gen Blood Donation Network</p>
            </div>

            <form>
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="fullname" placeholder="Enter your full name" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="age">Age</label>
                        <div class="input-wrapper">
                            <input type="number" id="age" min="18" max="65" placeholder="18-65" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <input type="email" id="email" placeholder="your@email.com" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper password-container">
                        <input type="password" id="password" placeholder="Min. 8 characters" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="input-wrapper password-container">
                        <input type="password" id="confirm-password" placeholder="Re-enter password" required>
                    </div>
                </div>

                <div class="terms-container">
                    <input type="checkbox" id="termsCheckbox" class="termscheckbox">
                    <label for="termsCheckbox" class="termslabel">I agree to the <a href="#" class="terms-link">Terms and Conditions</a></label>
                </div>
                <button type="submit" class="submit-btn" disabled>Sign Up</button>
            </form>

            <div class="login-link">
                Already have an account? <a href="loginpage/login.html">Log in here</a>
            </div>
        </div>
    </div>
</body>
</html>
