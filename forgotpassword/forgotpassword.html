<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | CrimsonSync</title>
  <link rel="stylesheet" href="forgotpassword.css">
</head>
<body>
  <main class="forgot-page">
    <section class="forgot-card">
      <div class="brand-panel">
        <div class="brand-badge">
          <div>
            <p class="brand-label">CrimsonSync</p>
            <p class="brand-subtitle">Password Recovery</p>
          </div>
        </div>
        <h1>Forgot your password?</h1>
        <p class="page-description">
          Enter the email address tied to your account and we’ll send you a secure reset link.
        </p>
      </div>

      <form id="forgotForm" class="forgot-form" novalidate>
        <div class="field-group">
          <label for="email">Email address</label>
          <input id="email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
          <span class="field-note" id="emailNote">Your privacy is our priority.</span>
        </div>

        <button type="submit" class="action-button" id="sendButton">
          <span class="button-text">Send Reset Link</span>
          <span class="loading-spinner" aria-hidden="true"></span>
        </button>

        <div class="status-message" id="statusMessage" aria-live="polite"></div>
      </form>

      <div class="footer-links">
        <a href="../loginpage/login.html" class="secondary-button">Back to login</a>
      </div>
    </section>
  </main>

  <script src="forgotpassword.js"></script>
</body>
</html>
