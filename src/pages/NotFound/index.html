<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - CrimsonSync</title>
    <link rel="stylesheet" href="../../styles/main.css">
    <script src="../../../public/env.js"></script>
<script>(function(){var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
<style>#page-transition{position:fixed;inset:0;background:#DC2626;z-index:9999;pointer-events:none;opacity:0;transition:opacity 0.35s cubic-bezier(0.4,0,0.2,1);}</style>
</head>
<body>
    <div id="page-transition"></div>
    <div class="auth-page">
        <div style="text-align:center;max-width:480px">
            <h1 style="font-size:6rem;font-weight:700;color:var(--primary);line-height:1">404</h1>
            <h2 style="margin:1rem 0">Page Not Found</h2>
            <p style="color:var(--text-light);margin-bottom:2rem">The page you're looking for doesn't exist or has been moved.</p>
            <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap">
                <a href="/index.html" class="btn btn-primary">Go Home</a>
                <a href="../Login/login.html" class="btn btn-secondary">Sign In</a>
            </div>
        </div>
    </div>
    <script type="module">
        import { initTheme } from '../../hooks/useTheme.js';
        initTheme();
    </script>
    <script>(function(){var o=document.getElementById("page-transition");if(!o)return;o.style.opacity="1";o.style.pointerEvents="all";requestAnimationFrame(function(){requestAnimationFrame(function(){o.style.opacity="0";o.style.pointerEvents="none";});});document.addEventListener("click",function(e){var a=e.target.closest("a[href]");if(!a)return;var h=a.getAttribute("href");if(!h||h.startsWith("#")||h.startsWith("mailto:")||h.startsWith("tel:")||h.startsWith("http")||a.target==="_blank")return;e.preventDefault();o.style.opacity="1";o.style.pointerEvents="all";setTimeout(function(){window.location.href=h;},350);});})();
    </script>
</body>
</html>
