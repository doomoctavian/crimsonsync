<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#DC2626">
    <title>Login - CrimsonSync</title>
    <link rel="stylesheet" href="../../styles/main.css">
    <script src="../../../public/env.js"></script>
    <style>
        #page-transition{position:fixed;inset:0;background:#DC2626;z-index:9999;pointer-events:none;opacity:0;transition:opacity 0.35s cubic-bezier(0.4,0,0.2,1);}
        .home-back-btn{position:fixed;top:1.25rem;left:1.25rem;z-index:100;display:inline-flex;align-items:center;gap:0.5rem;background:rgba(255,255,255,0.9);backdrop-filter:blur(8px);border:1.5px solid rgba(220,38,38,0.2);border-radius:2rem;padding:0.5rem 1rem;font-size:0.875rem;font-weight:600;color:#DC2626;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,0.08);transition:all 0.25s ease;}
        .home-back-btn:hover{background:#DC2626;color:#fff;border-color:#DC2626;transform:translateX(-2px);}
        .home-back-btn svg{width:1rem;height:1rem;}
        [data-theme="dark"] .home-back-btn{background:rgba(30,41,59,0.9);border-color:rgba(220,38,38,0.4);color:#f87171;}
        [data-theme="dark"] .home-back-btn:hover{background:#DC2626;color:#fff;}
    </style>
<script>(function(){var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
    <div id="page-transition"></div>
    <a href="../../../index.html" class="home-back-btn" id="homeBackBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Home
    </a>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-brand">
                <div>
                    <h2>Welcome to <span class="highlight">CrimsonSync</span></h2>
                    <p>Secure, centralized blood donor matching and real-time emergency coordination for hospitals, blood banks, and verified donors.</p>
                </div>
            </div>
            <div class="auth-card">
                <h1>Sign In</h1>
                <p class="auth-subtitle">Access your CrimsonSync account securely.</p>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
                        <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.9rem;cursor:pointer">
                            <input type="checkbox" id="remember"> Remember me
                        </label>
                        <a href="../ForgotPassword/forgotpassword.html" style="font-size:0.9rem">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                </form>
                <p class="auth-footer">Don't have an account? <a href="../Signup/signup.html">Sign up</a></p>
            </div>
        </div>
    </div>
    <script type="module" src="login.js"></script>
    <script>
    (function(){var o=document.getElementById('page-transition');if(!o)return;o.style.opacity='1';o.style.pointerEvents='all';requestAnimationFrame(function(){requestAnimationFrame(function(){o.style.opacity='0';o.style.pointerEvents='none';});});document.addEventListener('click',function(e){var a=e.target.closest('a[href]');if(!a)return;var h=a.getAttribute('href');if(!h||h.startsWith('#')||h.startsWith('mailto:')||h.startsWith('tel:')||h.startsWith('http')||a.target==='_blank')return;e.preventDefault();o.style.opacity='1';o.style.pointerEvents='all';setTimeout(function(){window.location.href=h;},350);});})();
    </script>
</body>
</html>
